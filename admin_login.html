<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | Daharki School System
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: #163d6b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 5px;
            color: #163d6b;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #163d6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #102f54;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #163d6b;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            DSS
        </div>

        <h1>
            Admin Login
        </h1>

        <div class="subtitle">
            Daharki School System
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form action="/api/admin/login" method="post">

            <label>
                Admin Email
            </label>

            <input type="email" name="email" required>


            <label>
                Password
            </label>

            <input type="password" name="password" required>


            <button type="submit">
                Login
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Admission Form
        </a>

    </div>

</body>

</html>
