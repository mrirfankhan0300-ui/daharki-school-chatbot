<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daharki School Admin Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">

<div class="login-card">
    <div class="brand centered">
        <div class="brand-badge">DSS</div>
    </div>

    <h2>Admin Login</h2>
    <p class="muted">Daharki School Administration</p>

    {% if error %}
    <div class="alert error-alert">{{ error }}</div>
    {% endif %}

    <form action="/admin/login" method="post">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="primary-btn">
            Login
        </button>
    </form>

    <div class="demo-box">
        <strong>Demo Admin</strong><br>
        admin@daharkischool.edu.pk<br>
        admin123
    </div>

    <div class="admin-link">
        <a href="/">Back to Admission Form</a>
    </div>
</div>

</body>
</html>
